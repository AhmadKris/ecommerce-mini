name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce_user
          POSTGRES_PASSWORD: ecommerce_password
          POSTGRES_DB: ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ecommerce-backend/go.sum

      - name: Go Vet
        run: |
          cd ecommerce-backend
          go vet ./...

      - name: Run Backend Tests
        env:
          DATABASE_URL: "postgres://ecommerce_user:ecommerce_password@localhost:5432/ecommerce_db?sslmode=disable"
          REDIS_ADDR: "localhost:6379"
          JWT_ACCESS_SECRET: "ci_access_secret_32_characters_minimum"
          JWT_REFRESH_SECRET: "ci_refresh_secret_32_characters_minimum"
        run: |
          cd ecommerce-backend
          go test -v -race ./...

      - name: Build API Binary
        run: |
          cd ecommerce-backend
          go build -o api ./cmd/api

  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ecommerce-frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd ecommerce-frontend
          npm ci

      - name: Typecheck
        run: |
          cd ecommerce-frontend
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd ecommerce-frontend
          npm test -- --run

      - name: Build Production Bundle
        run: |
          cd ecommerce-frontend
          npm run build
