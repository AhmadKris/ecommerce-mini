name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "ecommerce-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "ecommerce-backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: ecommerce-backend

# Separate jobs, not one script — a lint failure shouldn't hide whether
# tests would've passed (see .claude/CLAUDE.md §11 CI).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go-version-file, not a hardcoded string — a hardcoded version here
      # silently drifts out of sync the next time go.mod's `go` directive is
      # bumped (exactly what happened: govulncheck's stdlib-CVE fix bumped
      # go.mod to 1.26.6, this workflow stayed pinned at 1.26.4, and the
      # mismatch broke the lint job). Reading it from go.mod means it can't
      # drift again.
      - uses: actions/setup-go@v5
        with:
          go-version-file: ecommerce-backend/go.mod
      # Both the action AND the lint tool version pinned — `version: latest`
      # here would silently drift from whatever's installed locally
      # (currently v2.13.2), the exact inconsistency this fix is about.
      # Bump this deliberately, in the same commit as a local
      # golangci-lint upgrade, not automatically.
      # v9 of the action (current stable), not v6 — v6 only supports
      # golangci-lint v1.x and rejects a v2.x version string outright
      # ("golangci-lint v2 is not supported by golangci-lint-action v6").
      # .golangci.yml is already v2-format (see Linting & Pre-commit), and
      # every major from v7 onward requires v2 — v9 is the current one, not
      # the oldest one that happens to work.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: ecommerce-backend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ecommerce-backend/go.mod
      # -race here specifically because local dev on this project's Windows
      # box can't always run it (no C compiler) — ubuntu-latest ships gcc,
      # so CI is where races actually get caught, not optional here.
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race
      # Real Docker daemon is available on ubuntu-latest runners, so the
      # testcontainers-go suite (checkout race condition, inventory
      # adjustment race condition, cart ownership) runs for real instead of
      # only ever being verified by hand before a merge.
      - run: go test -tags=integration ./... -race

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ecommerce-backend/go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: ecommerce-backend
          push: false
          tags: ecommerce-backend:ci
