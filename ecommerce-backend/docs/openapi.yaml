openapi: 3.0.3
info:
  title: Ecommerce Mini API
  version: 0.1.0
  description: >
    REST API untuk platform e-commerce mini (auth, katalog produk, cart,
    checkout/order, admin). Selalu disinkronkan setiap kali route berubah —
    lihat internal/router untuk sumber kebenaran route yang aktif.
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
paths:
  /health:
    get:
      summary: Liveness probe (tanpa cek dependency)
      responses:
        "200":
          description: Service is alive
  /ready:
    get:
      summary: Readiness probe (cek koneksi database dan Redis)
      responses:
        "200":
          description: Service is ready to serve traffic
        "503":
          description: A dependency (database/Redis) is unavailable
  /api/auth/register:
    post:
      summary: >
        Registrasi customer baru (role customer otomatis, tidak bisa admin).
        Seluruh /api/auth/* dibatasi 10 request/menit per IP (lihat 429 di
        bawah) — mencegah brute-force/credential-stuffing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: Wajib mengandung huruf besar, huruf kecil, dan angka.
      responses:
        "201":
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Validasi gagal (format/panjang/kekuatan password)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Lebih dari 10 request/menit dari IP yang sama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/auth/login:
    post:
      summary: Login dan menerima access + refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Lebih dari 10 request/menit dari IP yang sama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/auth/refresh:
    post:
      summary: >
        Tukar refresh token dengan pasangan access+refresh token baru.
        Refresh token lama langsung di-blacklist (single-use) — dipakai
        ulang akan ditolak 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token baru berhasil diterbitkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Refresh token tidak valid, kedaluwarsa, atau sudah dipakai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/auth/forgot-password:
    post:
      summary: >
        Minta reset password. Selalu membalas pesan sukses generik yang
        sama, tidak peduli email-nya terdaftar atau tidak — supaya endpoint
        ini tidak bisa dipakai untuk enumerasi akun. Belum ada provider
        email terpasang di project ini (lihat .claude/CLAUDE.md Known
        Issues) — token dicatat ke server log, bukan benar-benar dikirim
        lewat email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: "Pesan generik: {message}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/auth/reset-password:
    post:
      summary: >
        Tukar token reset (dari forgot-password) dengan password baru.
        Token sekali pakai — dihapus begitu dipakai, permintaan kedua
        dengan token yang sama akan ditolak meski permintaan pertama
        berhasil. Kedaluwarsa 30 menit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "200":
          description: Password berhasil direset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Password baru tidak memenuhi syarat kekuatan (huruf besar+kecil+angka)
        "401":
          description: Token reset tidak valid, sudah dipakai, atau sudah kedaluwarsa
  /api/auth/me:
    get:
      summary: Profil user yang sedang login (id, name, email)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
  /api/profile/addresses:
    get:
      summary: List alamat tersimpan milik user yang login, default duluan
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "{items}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
    post:
      summary: >
        Simpan alamat baru. is_default:true otomatis meng-unset default
        sebelumnya (at-most-one-default invariant, dijaga dalam transaction).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_name, phone, address_line, city, province, postal_code]
              properties:
                recipient_name:
                  type: string
                phone:
                  type: string
                address_line:
                  type: string
                  minLength: 10
                city:
                  type: string
                province:
                  type: string
                postal_code:
                  type: string
                is_default:
                  type: boolean
      responses:
        "201":
          description: Alamat berhasil disimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
  /api/profile/addresses/{id}:
    put:
      summary: >
        Ubah alamat (full replace, semua field wajib dikirim ulang). Ditolak
        404 kalau alamat bukan milik user yang login (bukan 403 — cegah
        enumeration ID alamat user lain, sama seperti cart).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_name, phone, address_line, city, province, postal_code]
              properties:
                recipient_name:
                  type: string
                phone:
                  type: string
                address_line:
                  type: string
                city:
                  type: string
                province:
                  type: string
                postal_code:
                  type: string
                is_default:
                  type: boolean
      responses:
        "200":
          description: Alamat berhasil diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "404":
          description: Alamat tidak ditemukan atau milik user lain
    delete:
      summary: Hapus alamat (404 kalau bukan milik user yang login)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alamat berhasil dihapus
        "401":
          description: Tidak ada/token akses tidak valid
        "404":
          description: Alamat tidak ditemukan atau milik user lain
  /api/categories:
    get:
      summary: List semua kategori (public, tidak dipaginasi — jumlahnya kecil)
      responses:
        "200":
          description: "{items}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/admin/categories:
    post:
      summary: Buat kategori baru (butuh permission category:create)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
      responses:
        "201":
          description: Kategori berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission category:create
  /api/admin/categories/{id}:
    put:
      summary: Ubah nama kategori (butuh permission category:update, slug ikut diregenerasi)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
      responses:
        "200":
          description: Kategori berhasil diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Kategori tidak ditemukan
        "409":
          description: Nama baru menghasilkan slug yang sudah dipakai kategori lain
    delete:
      summary: >
        Hapus kategori (butuh permission category:delete). Ditolak 409 kalau
        masih ada produk yang mereferensikannya (products.category_id ON
        DELETE RESTRICT) — hapus/pindahkan produknya dulu.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Kategori berhasil dihapus
        "404":
          description: Kategori tidak ditemukan
        "409":
          description: Kategori masih dipakai oleh produk yang ada
  /api/products:
    get:
      summary: List produk (public), dengan filter kategori/pencarian dan pagination
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Slug kategori.
        - name: search
          in: query
          schema:
            type: string
          description: Dicocokkan terhadap nama produk (ILIKE).
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
            default: newest
          description: Nilai tidak dikenal fallback ke newest, bukan 400.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: "{items, meta} — lihat konvensi list endpoint di .claude/CLAUDE.md"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/products/{slug}:
    get:
      summary: Detail produk (public)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Produk ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/admin/products:
    post:
      summary: Buat produk baru (butuh permission product:create)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category_id]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                description:
                  type: string
                price:
                  type: number
                  minimum: 0
                stock:
                  type: integer
                  minimum: 0
                category_id:
                  type: integer
                image_url:
                  type: string
      responses:
        "201":
          description: >
            Produk dibuat. Slug dihasilkan otomatis dari nama; jika bentrok
            dengan produk lain, otomatis diberi suffix numerik (-2, -3, dst).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Validasi gagal, termasuk category_id yang tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission product:create
  /api/admin/products/{id}:
    put:
      summary: Update produk (butuh permission product:update)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Semua field opsional — hanya field yang dikirim yang diubah.
                Mengirim stock:0 valid (explicit zero), berbeda dari tidak
                mengirim field stock sama sekali.
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                category_id:
                  type: integer
                image_url:
                  type: string
      responses:
        "200":
          description: Produk diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission product:update
    delete:
      summary: >
        Hapus produk (butuh permission product:delete). Soft-delete
        (kolom deleted_at) — order/cart lama yang mereferensikan produk ini
        tidak rusak, produk cuma hilang dari katalog publik dan daftar
        admin. Slug-nya langsung bisa dipakai ulang produk lain.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Produk berhasil dihapus
        "404":
          description: Produk tidak ditemukan
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission product:delete
  /api/cart:
    get:
      summary: Ambil cart milik user yang sedang login (dibuat otomatis kalau belum ada)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "{items, total} — lihat CartResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
  /api/cart/items:
    post:
      summary: Tambah produk ke cart (kuantitas digabung kalau produk sudah ada di cart)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Cart terbaru setelah item ditambahkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: product_id tidak ditemukan
        "409":
          description: Kuantitas gabungan melebihi stok produk
        "401":
          description: Tidak ada/token akses tidak valid
  /api/cart/items/{id}:
    put:
      summary: Ubah kuantitas item cart (harus milik user yang login)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Cart terbaru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: >
            Item tidak ditemukan — termasuk kalau item itu ada tapi milik user
            lain (row-level ownership check di service layer, disengaja
            merespons sama seperti "tidak ada" untuk cegah enumerasi).
        "409":
          description: Kuantitas melebihi stok produk
        "401":
          description: Tidak ada/token akses tidak valid
    delete:
      summary: Hapus item dari cart (harus milik user yang login)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cart terbaru setelah item dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Item tidak ditemukan atau milik user lain (lihat catatan PUT di atas)
        "401":
          description: Tidak ada/token akses tidak valid
  /api/orders:
    post:
      summary: >
        Checkout — ubah cart milik user yang login jadi order. Atomic: cek
        stok, kurangi stok, buat order+order_items+payment, kosongkan cart,
        semua dalam satu transaction (row lock SELECT...FOR UPDATE per
        produk, mencegah oversell saat ada checkout bersamaan untuk produk
        yang sama). Response's total_amount sudah termasuk shipping_cost
        dan dikurangi discount_amount (flat rate ongkir saat ini) —
        satu-satunya angka total yang jadi sumber kebenaran, jangan dihitung
        ulang di client. promo_code opsional — divalidasi & di-redeem
        (row lock, mencegah over-redeem saat ada checkout bersamaan dengan
        kode yang sama) di transaction yang sama dengan pengurangan stok.
        Kode tidak valid/kedaluwarsa/melebihi batas pakai/di bawah minimum
        pembelian akan menggagalkan SELURUH checkout (409/400), bukan
        diam-diam melanjutkan tanpa diskon.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Opsional. Kirim UUID unik per percobaan checkout — request
            berikutnya dengan key yang sama (dari user yang sama) dalam 24
            jam akan me-replay response order yang pertama alih-alih
            membuat order baru (response header Idempotent-Replay: true).
            Mencegah double-order kalau client retry setelah koneksi
            terputus.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipping_address]
              properties:
                shipping_address:
                  type: string
                  minLength: 10
                  maxLength: 500
                promo_code:
                  type: string
                  description: Opsional. Kode promo, tidak case-sensitive.
      responses:
        "201":
          description: Order berhasil dibuat (atau di-replay dari Idempotency-Key sebelumnya)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Cart kosong
        "409":
          description: >
            Stok salah satu produk di cart tidak lagi mencukupi (dicek ulang
            saat checkout, bukan cuma saat add-to-cart — stok bisa berubah
            di antara keduanya)
        "401":
          description: Tidak ada/token akses tidak valid
    get:
      summary: Riwayat order milik user yang login (butuh permission order:read_own)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: "{items, meta}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission order:read_own
  /api/orders/{id}:
    get:
      summary: >
        Detail satu order milik user yang login (butuh permission
        order:read_own). Order milik user lain membalas 404, bukan 403 —
        supaya ID order tidak bisa dipakai enumerasi order siapa pun.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "404":
          description: Order tidak ditemukan atau bukan milik user yang login
  /api/admin/orders:
    get:
      summary: Riwayat order SELURUH user (admin, butuh permission order:read_all)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: "{items, meta}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission order:read_all
  /api/admin/orders/{id}:
    get:
      summary: >
        Detail satu order berikut rincian item-nya (admin, butuh permission
        order:read_all) — dasar untuk halaman Admin Order Detail di frontend.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission order:read_all
        "404":
          description: Order tidak ditemukan
  /api/admin/orders/{id}/status:
    patch:
      summary: >
        Ubah status order (admin, butuh permission order:update_status).
        Transisi dibatasi (lihat orderStatusTransitions di
        internal/service/order_service.go): pending→paid/cancelled,
        paid→processing/cancelled, processing→shipped/cancelled,
        shipped→delivered. delivered dan cancelled adalah status akhir
        (tidak bisa diubah lagi). Transisi di luar daftar itu ditolak 409,
        bukan diterima diam-diam.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, paid, processing, shipped, delivered, cancelled]
      responses:
        "200":
          description: Status order berhasil diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Status tidak dikenal (bukan salah satu enum di atas)
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission order:update_status
        "404":
          description: Order tidak ditemukan
        "409":
          description: Transisi status tidak valid dari status order saat ini
  /api/admin/inventory/adjustments:
    post:
      summary: >
        Sesuaikan stok produk (admin, butuh permission inventory:adjust).
        Atomic (row lock SELECT...FOR UPDATE, sama pola dengan checkout) —
        cek stok dan tulis inventory_movements dalam satu transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, type, reason]
              properties:
                product_id:
                  type: integer
                type:
                  type: string
                  enum: [in, out, correction]
                  description: >
                    in/out: quantity adalah delta yang ditambah/dikurangi
                    dari stok saat ini. correction: quantity adalah nilai
                    stok baru absolut (bukan delta) — untuk rekonsiliasi ke
                    hasil stock opname.
                quantity:
                  type: integer
                  minimum: 0
                reason:
                  type: string
                reference:
                  type: string
      responses:
        "201":
          description: Penyesuaian berhasil, response berisi InventoryMovement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission inventory:adjust
        "404":
          description: Produk tidak ditemukan
        "409":
          description: "Adjustment type=out melebihi stok yang tersedia (hasil akhir akan negatif)"
  /api/admin/inventory/{productId}/movements:
    get:
      summary: Riwayat pergerakan stok satu produk (admin, butuh permission inventory:read)
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: "{items, meta}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission inventory:read
  /api/admin/promotions:
    get:
      summary: List semua kode promo (admin, butuh permission promotion:manage)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "{items}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission promotion:manage
    post:
      summary: >
        Buat kode promo baru (admin, butuh permission promotion:manage).
        Code dinormalisasi ke uppercase.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, value, usage_limit, starts_at, ends_at]
              properties:
                code:
                  type: string
                  minLength: 3
                type:
                  type: string
                  enum: [percentage, fixed]
                  description: >
                    percentage: value 1-100, persen dari subtotal item
                    (belum termasuk ongkir). fixed: value adalah potongan
                    IDR flat. Keduanya dibatasi maksimum sebesar subtotal —
                    diskon tidak pernah membuat total jadi negatif.
                value:
                  type: number
                minimum_purchase:
                  type: number
                usage_limit:
                  type: integer
                  minimum: 1
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Promo berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission promotion:manage
        "409":
          description: Kode promo sudah dipakai
  /api/admin/promotions/{id}:
    put:
      summary: >
        Ubah promo (full replace kecuali code — code tidak bisa diubah,
        hapus lalu buat baru kalau perlu kode berbeda).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value, usage_limit, starts_at, ends_at, status]
              properties:
                type:
                  type: string
                  enum: [percentage, fixed]
                value:
                  type: number
                minimum_purchase:
                  type: number
                usage_limit:
                  type: integer
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        "200":
          description: Promo berhasil diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission promotion:manage
        "404":
          description: Promo tidak ditemukan
    delete:
      summary: >
        Hapus promo. Order yang sudah redeem kode ini tetap menyimpan
        discount_amount-nya (promotion_id di order jadi NULL, snapshot
        angka diskon tidak berubah).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Promo berhasil dihapus
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Token valid tapi tidak punya permission promotion:manage
        "404":
          description: Promo tidak ditemukan
  /api/products/{slug}/reviews:
    get:
      summary: List ulasan produk (public) — hanya status approved yang tampil
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: "{items, meta} — lihat konvensi list endpoint di .claude/CLAUDE.md"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Produk tidak ditemukan
    post:
      summary: >
        Buat ulasan untuk produk (butuh login). Server memverifikasi sendiri
        bahwa caller punya order berstatus delivered yang berisi produk ini —
        order_id tidak diminta dari client, jadi tidak bisa memalsukan
        pembelian. Satu user hanya bisa mengulas satu produk sekali.
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, title, body]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                title:
                  type: string
                  minLength: 3
                  maxLength: 255
                body:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        "201":
          description: >
            Ulasan dibuat dengan status pending — baru tampil di halaman
            produk publik setelah disetujui admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Data ulasan tidak valid
        "401":
          description: Tidak ada/token akses tidak valid
        "403":
          description: Caller tidak punya order delivered yang berisi produk ini
        "404":
          description: Produk tidak ditemukan
        "409":
          description: Caller sudah pernah mengulas produk ini
