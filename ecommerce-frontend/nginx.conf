server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (Vite's [name]-[hash].js/.css) are safe to cache
    # forever — a content change always ships under a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unmatched path (client-side route) resolves to
    # index.html so React Router can take over.
    location / {
        try_files $uri /index.html;
    }
}
