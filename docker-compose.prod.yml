services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce-prod-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.0
    container_name: ecommerce-prod-migrate
    volumes:
      - ./ecommerce-backend/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://ecommerce_user:ecommerce_password@postgres:5432/ecommerce_db?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./ecommerce-backend
      dockerfile: Dockerfile
    container_name: ecommerce-prod-api
    restart: always
    environment:
      PORT: "8080"
      ENV: "production"
      DATABASE_URL: "postgres://ecommerce_user:ecommerce_password@postgres:5432/ecommerce_db?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      JWT_ACCESS_SECRET: "prod_access_secret_super_secret_32chars"
      JWT_REFRESH_SECRET: "prod_refresh_secret_super_secret_32chars"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "168h"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      BCRYPT_COST: "12"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "10"
      DB_CONN_MAX_LIFETIME: "15m"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./ecommerce-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8080/api"
    container_name: ecommerce-prod-web
    restart: always
    ports:
      - "3000:8080"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ecommerce-prod-prometheus
    restart: always
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ecommerce-prod-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_prod_data:
  redis_prod_data:
